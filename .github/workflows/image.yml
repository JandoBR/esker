name: Image

# Tests the server and the SPA, builds the image and pushes it to GHCR.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "migrations/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".dockerignore"
      - "flake.*"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jandobr/esker
  NIX_CONFIG: |
    build-users-group =
    sandbox = false
    experimental-features = nix-command flakes

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: image tags are ordered by commit.
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            build-users-group =
            sandbox = false
            experimental-features = nix-command flakes

      - name: Test the server
        run: |
          nix develop .#ci --command bash -c '
            cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
          '

      - name: Build the SPA
        run: |
          nix develop .#web --command bash -c 'cd web && npm ci && npm run build'

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
