name: Image

# Tests the server and the SPA, builds the image, pushes it to the registry,
# puts the stack live and prunes old versions.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "migrations/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".dockerignore"
      - "flake.*"
      - ".forgejo/workflows/image.yml"
  workflow_dispatch:

# The runner has Nix installed but not on PATH. NIX_CONFIG avoids the `nixbld`
# group and the sandbox, which the runner does not have.
env:
  IMAGE: ghcr.io/jandobr/enderboard
  STACK: enderboard
  NIX_CONFIG: |
    build-users-group =
    sandbox = false
    experimental-features = nix-command flakes

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: pruning orders image tags by commit.
          fetch-depth: 0

      # Nothing below runs, and nothing is deployed, unless the tests pass.
      - name: Test the server
        run: |
          export PATH="/nix/var/nix/profiles/default/bin:$HOME/.nix-profile/bin:$PATH"
          nix develop .#ci --command bash -c '
            cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
          '

      - name: Build the SPA
        run: |
          export PATH="/nix/var/nix/profiles/default/bin:$HOME/.nix-profile/bin:$PATH"
          nix develop .#web --command bash -c 'cd web && npm ci && npm run build'

      - name: Build the image
        run: |
          docker build \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .

      - name: Push the image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      # Both steps run scripts kept in Dev-kit (ci/scripts), so there is nothing
      # to copy into the project. The stack must already exist on the server.
      - name: Deploy
        uses: https://forgejo.example.com/Jando/Dev-kit/ci/actions/deploy@main
        with:
          stack: ${{ env.STACK }}

      - name: Prune old images
        uses: https://forgejo.example.com/Jando/Dev-kit/ci/actions/prune-images@main
        with:
          image: ${{ env.IMAGE }}
