
# Enderboard. Sign-in is its own OIDC client in Pocket ID, so the vhost only
# has to let large uploads through.
server {
  listen 80;
  server_name board.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name board.example.com;

  ssl_certificate     /config/keys/letsencrypt/fullchain.pem;
  ssl_certificate_key /config/keys/letsencrypt/privkey.pem;

  location / {
    proxy_pass http://127.0.0.1:8091;
    include /config/nginx/snippets/proxy_common.conf;

    # Modpacks and other large files. nginx defaults to 1m and buffers the
    # whole request; both get in the way of a streaming upload.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
