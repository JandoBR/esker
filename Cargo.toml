[package]
name = "enderboard"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "fs",
  "io-util",
  "signal",
  "time",
] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
async_zip = { version = "0.0.19", default-features = false, features = [
  "chrono",
  "deflate",
  "tokio",
] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openidconnect = "4"
url = "2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
percent-encoding = "2"
mime_guess = "2"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
