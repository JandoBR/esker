# Example stack for a server. The image is built and pushed by the workflow in
# .github/workflows/; change the image name if you build it yourself.
services:
  esker:
    image: ghcr.io/jandobr/esker:latest
    container_name: esker
    # Match the owner of the data directory: mkdir -p /srv/appdata/esker &&
    # chown 99:100 /srv/appdata/esker
    user: "99:100"
    restart: unless-stopped
    env_file:
      - board.env
    environment:
      - TZ=America/Bogota
      - BOARD_PUBLIC_URL=https://board.example.com
      - OIDC_ISSUER=https://id.example.com
      - OIDC_GROUP_CLAIM=groups
      - OIDC_ADMIN_GROUP=admin
    ports:
      # The proxy reaches it here; board.example.com points at this port.
      - "8091:8080"
    volumes:
      - /srv/appdata/esker:/data
    networks:
      - internal

networks:
  internal:
    external: true
