# Local or server stack. This mirrors the stack in nixos-config; on the server
# the image is built and pushed by the .forgejo workflow.
services:
  enderboard:
    image: ghcr.io/jandobr/enderboard:latest
    container_name: enderboard
    # Match the owner of the data directory: mkdir -p /srv/appdata/enderboard &&
    # chown 99:100 /srv/appdata/enderboard
    user: "99:100"
    restart: unless-stopped
    env_file:
      - board.env
    environment:
      - TZ=America/Bogota
      - BOARD_PUBLIC_URL=https://board.example.com
      - OIDC_ISSUER=https://id.example.com
      - OIDC_GROUP_CLAIM=groups
      - OIDC_ADMIN_GROUP=admin
    ports:
      # The proxy reaches it here; board.example.com points at this port.
      - "8091:8080"
    volumes:
      - /srv/appdata/enderboard:/data
    networks:
      - internal

networks:
  internal:
    external: true
